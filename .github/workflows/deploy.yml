
name: Group Project CI/CD SFTP Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # STEP 1: Validate HTML files
  validate-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify HTML Files Exist and Validate Structure
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html found."
          else
            echo "ERROR: index.html is missing!"
            exit 1
          fi

          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -print0 | while IFS= read -r -d '' file; do
              if grep -iq "<html" "$file"; then
                echo "Validated structure for $file"
              else
                echo "Invalid HTML structure in $file"
                exit 1
              fi
            done

  # STEP 2: Deploy to the SFTP server after pushes to main
  deploy-to-server:
    runs-on: ubuntu-latest
    needs: validate-code

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      - name: Prepare Website Files
        run: |
          mkdir deploy
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C deploy
          rm -rf deploy/.git
          test -f deploy/index.html

      - name: Transfer Files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "./deploy/*"
          remote_path: "/home/lsu-source-tinytrouble/htdocs/tinytrouble.lsu-source.org"
          args: "-o ConnectTimeout=30"
